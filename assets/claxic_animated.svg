<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170" width="100%" height="170">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="50%" stop-color="#121826" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <linearGradient id="cBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.2" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="cTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="cCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Radial Glow -->
    <radialGradient id="cGlow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>

    <filter id="cFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .c-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 26px;
        font-weight: 900;
        letter-spacing: -0.5px;
        fill: url(#cTitleGrad);
      }
      .c-badge {
        font-family: 'Fira Code', monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.4px;
        fill: #38BDF8;
      }
      .c-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        font-weight: 400;
        fill: #94A3B8;
      }
      .c-pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        font-weight: 600;
        fill: #E2E8F0;
      }

      @keyframes floatCore {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-7px) rotate(1deg); }
      }
      @keyframes floatSat1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-9px) rotate(-3deg); }
      }
      @keyframes floatSat2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-6px) rotate(3deg); }
      }
      @keyframes spinOrbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.8); }
      }

      .f-core {
        animation: floatCore 4s ease-in-out infinite;
        transform-origin: center;
        transform-box: fill-box;
      }
      .f-sat-1 {
        animation: floatSat1 3.6s ease-in-out infinite;
        transform-origin: center;
        transform-box: fill-box;
      }
      .f-sat-2 {
        animation: floatSat2 4.2s ease-in-out infinite;
        transform-origin: center;
        transform-box: fill-box;
      }
      .s-orbit {
        animation: spinOrbit 22s linear infinite;
        transform-origin: center;
        transform-box: fill-box;
      }
      .p-dot {
        animation: pulseDot 1.8s ease-in-out infinite;
        transform-origin: center;
        transform-box: fill-box;
      }
    </style>
  </defs>

  <!-- Frame -->
  <rect x="2" y="2" width="716" height="166" rx="14" fill="url(#cBg)" stroke="url(#cBorder)" stroke-width="1.2" />
  <rect x="360" y="2" width="358" height="166" rx="14" fill="url(#cGlow)" />

  <!-- Dots Matrix -->
  <g opacity="0.15">
    <circle cx="480" cy="40" r="1.5" fill="#38BDF8" /><circle cx="520" cy="40" r="1.5" fill="#38BDF8" /><circle cx="560" cy="40" r="1.5" fill="#38BDF8" /><circle cx="600" cy="40" r="1.5" fill="#38BDF8" /><circle cx="640" cy="40" r="1.5" fill="#38BDF8" />
    <circle cx="480" cy="85" r="1.5" fill="#38BDF8" /><circle cx="520" cy="85" r="1.5" fill="#38BDF8" /><circle cx="560" cy="85" r="1.5" fill="#38BDF8" /><circle cx="600" cy="85" r="1.5" fill="#38BDF8" /><circle cx="640" cy="85" r="1.5" fill="#38BDF8" />
    <circle cx="480" cy="130" r="1.5" fill="#38BDF8" /><circle cx="520" cy="130" r="1.5" fill="#38BDF8" /><circle cx="560" cy="130" r="1.5" fill="#38BDF8" /><circle cx="600" cy="130" r="1.5" fill="#38BDF8" /><circle cx="640" cy="130" r="1.5" fill="#38BDF8" />
  </g>

  <!-- LEFT: Project Identity -->
  <g transform="translate(32, 26)">
    <!-- Pill -->
    <rect x="0" y="0" width="154" height="22" rx="11" fill="#0369A1" fill-opacity="0.25" stroke="#0284C7" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="11" cy="11" r="3" fill="#38BDF8" class="p-dot" />
    <text x="22" y="15" class="c-badge">EDTECH PLATFORM</text>

    <!-- Title -->
    <text x="0" y="55" class="c-title">CLAXIC</text>

    <!-- Tagline -->
    <text x="0" y="80" class="c-sub">Interactive Academic Learning &amp; Course Collaboration Hub</text>

    <!-- Mini Features -->
    <g transform="translate(0, 98)">
      <rect x="0" y="0" width="86" height="22" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="10" y="15" class="c-pill-text">⚡ Full Stack</text>

      <rect x="94" y="0" width="90" height="22" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="104" y="15" class="c-pill-text">🎓 Education</text>

      <rect x="192" y="0" width="82" height="22" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="202" y="15" class="c-pill-text">⭐ Live App</text>
    </g>
  </g>

  <!-- RIGHT: Animated Floating Core & Orbiting Tech Badges -->
  <g transform="translate(575, 85)">
    <!-- Orbit Track -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.35" class="s-orbit" />
    <circle cx="0" cy="0" r="38" fill="#38BDF8" fill-opacity="0.08" />

    <!-- Center Floating Emblem: Academic Diamond -->
    <g class="f-core">
      <polygon points="0,-36 33,0 0,36 -33,0" fill="url(#cCoreGrad)" stroke="#38BDF8" stroke-width="1.8" filter="url(#cFilter)" />
      <polygon points="0,-29 26,0 0,29 -26,0" fill="#0F172A" fill-opacity="0.9" stroke="#818CF8" stroke-width="1" />

      <!-- Graduation Cap -->
      <g transform="translate(0, -3) scale(0.75)">
        <polygon points="0,-14 20,-3 0,8 -20,-3" fill="#38BDF8" />
        <polygon points="0,-11 16,-3 0,5 -16,-3" fill="#E0F2FE" fill-opacity="0.4" />
        <path d="M-11,2 L0,8 L11,2 L11,10 C11,15 -11,15 -11,10 Z" fill="#0284C7" />
        <line x1="16" y1="-2" x2="18" y2="8" stroke="#FCD34D" stroke-width="1.6" stroke-linecap="round" />
        <circle cx="18" cy="9" r="1.5" fill="#FCD34D" />
      </g>
    </g>

    <!-- Satellite: React Atom (Top Right) -->
    <g transform="translate(56, -38)" class="f-sat-1">
      <rect x="-18" y="-14" width="36" height="28" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" filter="url(#cFilter)" />
      <ellipse cx="0" cy="0" rx="8" ry="3" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(30)" />
      <ellipse cx="0" cy="0" rx="8" ry="3" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(90)" />
      <ellipse cx="0" cy="0" rx="8" ry="3" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(150)" />
      <circle cx="0" cy="0" r="1.8" fill="#61DAFB" />
    </g>

    <!-- Satellite: Node.js (Bottom Right) -->
    <g transform="translate(52, 40)" class="f-sat-2">
      <polygon points="0,-15 14,-7 14,7 0,15 -14,7 -14,-7" fill="#0F172A" stroke="#22C55E" stroke-width="1.2" filter="url(#cFilter)" />
      <text x="0" y="3.5" text-anchor="middle" font-family="'Fira Code', monospace" font-size="8" font-weight="900" fill="#4ADE80">JS</text>
    </g>

    <!-- Satellite: Tailwind Wave (Bottom Left) -->
    <g transform="translate(-56, 36)" class="f-sat-1">
      <rect x="-18" y="-14" width="36" height="28" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-width="1.2" filter="url(#cFilter)" />
      <path d="M-8,2 C-7,-1 -4,-2 -3,1 C-2,4 1,3 2,1 C1,4 4,4 5,2 C6,0 8,1 8,3" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Satellite: JS (Top Left) -->
    <g transform="translate(-58, -36)" class="f-sat-2">
      <rect x="-15" y="-13" width="30" height="26" rx="6" fill="#F7DF1E" stroke="#EAB308" stroke-width="1" />
      <text x="0" y="4.5" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" fill="#000000">JS</text>
    </g>
  </g>
</svg>
