name: Live Auto-Sync Profile

on:
  schedule:
    # Runs every hour to sync latest git activity and repos
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab at any time
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync Repos & Live Git Activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-projects.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --staged --quiet; then
            echo "Profile already up to date."
          else
            git commit -m "chore(live-sync): update real-time repos, activity, and streak [skip ci]"
            git push
          fi
